name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Moonbit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: "0.10.4+2cc641edf"
          core-version: "0.10.4+2cc641edf"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: "yarn"

      - name: Install JavaScript test dependencies
        run: corepack yarn@1.22.22 install --frozen-lockfile --ignore-scripts

      - name: Check, test, and build the JS target
        run: |
          moon version
          moon check --target js
          moon test --target js
          moon build --target js --debug

      - name: Verify generated interface and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code

      - name: Verify public API documentation floor
        run: corepack yarn@1.22.22 check:docs

      - name: Install Chromium
        run: corepack yarn@1.22.22 playwright install --with-deps chromium

      - name: Run real-browser conformance
        run: corepack yarn@1.22.22 test:browser
